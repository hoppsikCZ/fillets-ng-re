name: CMake on multiple platforms

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
        exclude:
          - os: windows-latest
            c_compiler: gcc
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y libsdl2-dev libsdl2-image-dev \
          libsdl2-mixer-dev libsdl2-ttf-dev libsdl2-gfx-dev liblua5.4-dev
          
    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: vcpkg install sdl2 sdl2-image sdl2-mixer sdl2-ttf sdl2-gfx lua
      
    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        
    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}
        
    - name: Configure CMake (Linux)
      if: runner.os != 'Windows'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}
        
    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}
      
    - name: Package
      shell: bash
      env:
        BUILD_DIR: ${{ steps.strings.outputs.build-output-dir }}
        CONFIG_SUBDIR: ${{ runner.os == 'Windows' && 'Release/' || '' }}
      run: |
        mkdir -p staging
        cp "${BUILD_DIR}/${CONFIG_SUBDIR}fillets${{ runner.os == 'Windows' && '.exe' || '' }}" staging/
        cp -r images images-baseline script music sound font staging/
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: fillets-ng-re-${{ runner.os }}
        path: staging/*

  build-macos:
    name: Build on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          brew update
          brew install cmake pkg-config sdl2 sdl2_image sdl2_mixer sdl2_ttf sdl2_gfx lua
          
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        
      - name: Build project
        run: cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      - name: Package
        run: |
          mkdir -p staging
          cp build/fillets staging/
          cp -r images images-baseline script music sound font staging/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fillets-ng-re-macOS
          path: staging/*